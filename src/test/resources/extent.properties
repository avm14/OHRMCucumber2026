#Basic configuration to initialize reporter
extent.reporter.spark.start=true
extent.reporter.spark.out=target/Reports/ExtentReport.html

#Config for screenshot attachment.

#physical location is provided and screenshot is also saved in local
screenshot.dir=screenshot/
screenshot.rel.path=../../screenshot/

#if base64 config is done, no physical location is needed, nothing saved in local
#if u want to see thumbnail, then spark.xml must be created and thumbnail should be true
#extent.reporter.spark.base64imagesrc=true
